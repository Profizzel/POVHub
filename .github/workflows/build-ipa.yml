name: Build POV Hub IPA for Windows Sideloadly
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build POVHub
        run: |
          xcodebuild -project POVHub.xcodeproj -target POVHub -configuration Release -sdk iphoneos -destination "generic/platform=iOS" CONFIGURATION_BUILD_DIR=build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual
      - name: Package IPA
        run: |
          APP=$(find . -name "POVHub.app" -type d | head -1)
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -r POVHub-unsigned.ipa Payload
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: POVHub-IPA-for-Sideloadly
          path: POVHub-unsigned.ipa
